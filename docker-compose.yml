services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_pilot
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-locally}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - campus_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://campus:${MYSQL_PASSWORD:-change-me-locally}@mysql:3306/campus_pilot
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-this-secret}
      FRONTEND_ORIGIN: http://localhost:5173
      COLLEGE_TIMEZONE: ${COLLEGE_TIMEZONE:-Asia/Kolkata}
      UPLOAD_DIR: /data/private_uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - campus_uploads:/data/private_uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  campus_mysql:
  campus_uploads:
